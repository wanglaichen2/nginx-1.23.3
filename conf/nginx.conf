	# http://h5project2-yjh-login.iwgame.com:4003/ws -----------> http://127.0.0.1:6003/ws
    server {
        listen       4003; 
        server_name h5project2-yjh-login.iwgame.com; 
        large_client_header_buffers 4 128k;
        client_max_body_size 300m;
        client_body_buffer_size 128k;
        proxy_connect_timeout 600;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_buffer_size 64k;
        proxy_buffers   4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;

	#开放4001接口地址
         location /ws { 
            proxy_pass http://127.0.0.1:6003/ws;#转发请求的地址
            proxy_set_header HTTP_X_FORWARDED_FOR "$remote_addr:$remote_port" ;
            proxy_set_header Host $host:$server_port;                   
            proxy_connect_timeout 60s;             
            proxy_read_timeout 300s;             
            proxy_send_timeout 60s; 
        }

    }  
    
	map $http_upgrade $connection_upgrade { 
        default upgrade; 
        '' close; 
	} 
	upstream wsbackend{ 
        server 127.0.0.1:6001; 
        server 127.0.0.1:6002; 
        keepalive 1000; 
	}
	# wss://h5project2-yjh-login.iwgame.com:4001/ws -----------> http://127.0.0.1:6001/ws
	server{
        listen 4001 ssl; 
		#listen 4001 ssl http2;
        server_name h5project2-yjh-login.iwgame.com;  
        ssl_certificate      iwgame.com.crt;
        ssl_certificate_key  iwgame.com.key;
        
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        
        ssl_ciphers  ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers  on;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;  
         
        #ssl_verify_client off;
        location /ws{
                proxy_http_version 1.1;
                proxy_pass http://127.0.0.1:6001/ws;
                proxy_redirect off; 
                proxy_set_header Host $host; 
                proxy_set_header X-Real-IP $remote_addr; 
                proxy_read_timeout 3600s; 
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
                proxy_set_header Upgrade $http_upgrade; 
                proxy_set_header Connection $connection_upgrade; 
		}
        location = /documents { 
                return 200 '[4001 ssl]configuration A';
        }
        location /documents {
                return 200 '[4001 ssl]configuration B';
        }
        location /documents/txt1 {
                return 200 '[4001 ssl]configuration C';
        }
        location ^~ /documents/ {
                return 200 '[4001 ssl]configuration D';
        }
        location ~* /documents/(\w+)$ {
                return 200 '[4001 ssl]configuration E';
        }
        location ~ /documents/$ {
                return 200 '[4001 ssl]configuration F';
        }
	} 
    
	# WS 配置
	server {
		listen 4004;
        server_name h5project2-yjh-login.iwgame.com; 

		location /ws {
			proxy_pass http://127.0.0.1:6001/ws; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
		}
	}
    # HTTPS server
    #
    server {
        listen 80;
		listen 443 ssl http2;
        server_name h5project2-yjh-login.iwgame.com; 

        ssl_certificate      iwgame.com.crt;
        ssl_certificate_key  iwgame.com.key;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;


        ssl_ciphers  ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers  on;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        error_page 497  https://$host$request_uri;

        #SSL-END
    
        #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
