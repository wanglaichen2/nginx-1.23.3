
# 文件名: nginx_668996.xyz.conf
# 通配路径反代（ChenLab Next middleware 支持 /端口号/ 前缀）：
#   http://aa.668996.xyz:3001/      → 直连（不经本 conf）
#   http://aa.668996.xyz/3001/      → 127.0.0.1:3001/3001/
#   http://aa.668996.xyz/3006/      → 127.0.0.1:3006/3006/
#
# 注意：不要把 /3001 301 成 /3001/ —— Next 默认会把带尾斜杠的路径 308 回无尾斜杠，
#       会与 Nginx 301 形成死循环（access 里会刷 301/308）。
#
# 部分 Next 请求仍会打到站点根（/_next、/api、/__nextjs_*），
# 按 Referer 里的 /端口/ 回源；无 Referer 时默认 3001。
#
# 使用（本文件已在 nginx-1.23.3\）：
#   1) 复制为 conf\nginx.conf
#   2) 证书从 deploy_ssl_668996\ 复制到 conf\
#   3) 本目录执行 nginx.exe -t && reload
# 建议证书路径写：conf/668996.xyz.pem 与 conf/668996.xyz.key

#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 根路径回源端口：优先 Referer 中的 /3001/ 等
    map $http_referer $next_backend_port {
        default                        3001;
        "~^https?://[^/]+/(\d+)(/|$)"  $1;
    }

    server {
        listen       80;
        listen       443 ssl;
        server_name  668996.xyz www.668996.xyz aa.668996.xyz;
        ssl_certificate      C:/pro/nginx-1.23.3/conf/668996.xyz.pem;
        ssl_certificate_key  C:/pro/nginx-1.23.3/conf/668996.xyz.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 100m;

        # /3001 与 /3001/ 都直接反代（禁止互跳 301/308）
        location ~ ^/(?<app_port>\d+)$ {
            proxy_pass http://127.0.0.1:$app_port;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /$app_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location ~ ^/(?<app_port>\d+)/ {
            proxy_pass http://127.0.0.1:$app_port;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /$app_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # 下列根路径请求：按 Referer 端口回源（不要落到 html/）
        location /_next/ {
            proxy_pass http://127.0.0.1:$next_backend_port;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:$next_backend_port;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location /__nextjs_original-stack-frames {
            proxy_pass http://127.0.0.1:$next_backend_port;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
